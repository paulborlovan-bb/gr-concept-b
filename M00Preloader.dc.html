<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { show: true };
  componentDidMount() {
    this.paintBg();
    const go = () => window.GW && window.GRIFFNER_CONTENT ? this.run() : setTimeout(go, 30);
    go();
  }
  componentDidUpdate() {
    const v = this.v();
    if (this.ran && this.lastV && v !== this.lastV) { this.lastV = v; this.replay(); }
  }
  componentWillUnmount() { this.runId = -1; document.documentElement.style.overflow = ''; }
  v() { return this.props.variant ?? 'licht'; }
  paintBg() {
    const L = document.querySelector('[data-pl]');
    if (L) L.style.background = ['kreis', 'fertigung'].includes(this.v()) ? 'var(--room-loader)' : '#000000';
  }
  replay() {
    this.runId = (this.runId || 0) + 1;
    dispatchEvent(new Event('griffner:replay'));
    GW.loaderFinished = false; GW.introDone = false;
    scrollTo(0, 0);
    this.setState({ show: false }, () => this.setState({ show: true }, () => requestAnimationFrame(() => { this.paintBg(); this.run(true); })));
  }
  run(force) {
    this.ran = true; this.lastV = this.v();
    const id = this.runId = (this.runId || 0) + 1;
    let seen = false;
    try { seen = sessionStorage.getItem('griffner-intro-seen') === '1'; sessionStorage.setItem('griffner-intro-seen', '1'); } catch (e) {}
    if (GW.reduce || (seen && !this.props.force && !force)) { this.setState({ show: false }); GW.loaderDone({ skipped: true }); return; }
    const L = document.querySelector('[data-pl]');
    if (!L) { GW.loaderDone({ skipped: true }); return; }
    scrollTo(0, 0);
    document.documentElement.style.overflow = 'hidden';
    const field = GW.fieldStart();
    const rect = L.querySelector('[data-pl-rect]'), mark = L.querySelector('[data-pl-mark]');
    Object.assign(mark.style, { left: field.x + 'px', top: field.y + field.h + field.w * .078 + 'px' });
    const io3 = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    const seg = (T, a, b, f) => (f || GW.ease)(Math.min(1, Math.max(0, (T - a) / (b - a))));
    const write = (T, a, b) => { mark.style.clipPath = 'inset(0 ' + (100 - seg(T, a, b) * 100).toFixed(2) + '% 0 0)'; };
    const box = (el, r) => Object.assign(el.style, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' });
    const ctx = { L, rect, mark, field, io3, seg, write, box, vw: innerWidth, vh: innerHeight };
    const V = (this['v_' + this.v()] || this.v_kreis).call(this, ctx);
    let T = 0, last = performance.now(), skip = false, done = false;
    const tick = () => {
      if (done || id !== this.runId) return;
      const now = performance.now(); let dt = Math.min(.1, (now - last) / 1000); last = now;
      if (skip) { if (T < V.jump) T = V.jump; dt *= V.speed; }
      T += dt;
      V.frame(T);
      if (T >= V.end) finish(); else requestAnimationFrame(tick);
    };
    const finish = () => {
      if (done) return; done = true;
      document.documentElement.style.overflow = '';
      GW.loaderDone({ field });
      requestAnimationFrame(() => requestAnimationFrame(() => { if (id !== this.runId) return; L.style.display = 'none'; this.setState({ show: false }); }));
    };
    requestAnimationFrame(tick);
    const sk = () => { skip = true; };
    L.addEventListener('click', sk);
    L.addEventListener('touchstart', sk, { passive: true });
    L.addEventListener('wheel', e => { e.preventDefault(); sk(); }, { passive: false });
    addEventListener('keydown', sk, { once: true });
  }

  v_kreis({ L, rect, field, io3, seg, write, vw, vh }) {
    const NS = 'http://www.w3.org/2000/svg';
    const COLS = vw < 700 ? 5 : 10, CS = vw / COLS, ROWS = Math.ceil(vh / CS) + 1, OY = -CS / 6;
    const ODD = vw < 700 ? [3, 2] : [6, 1];
    const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
    const RAD = { circle: [.5, .5, .5, .5], arch: [.5, .5, 0, 0], quarter: [1, 0, 0, 0] };
    const cellPath = (sz, [a, b, c, d]) => 'M' + a + ' 0H' + (sz - b) + 'A' + b + ' ' + b + ' 0 0 1 ' + sz + ' ' + b + 'V' + (sz - c) + 'A' + c + ' ' + c + ' 0 0 1 ' + (sz - c) + ' ' + sz + 'H' + d + 'A' + d + ' ' + d + ' 0 0 1 0 ' + (sz - d) + 'V' + a + 'A' + a + ' ' + a + ' 0 0 1 ' + a + ' 0Z';
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('width', vw); svg.setAttribute('height', vh); svg.style.cssText = 'position:absolute;inset:0';
    L.querySelector('[data-pl-grid]').appendChild(svg);
    const cells = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const i = r * COLS + c, q = rnd(i), odd = c === ODD[0] && r === ODD[1];
      const type = odd ? 'quarter' : q < .3 ? 'circle' : q < .56 ? 'arch' : q < .9 ? 'quarter' : 'none';
      if (type === 'none') continue;
      const g = document.createElementNS(NS, 'g'), p = document.createElementNS(NS, 'path');
      p.setAttribute('fill', '#000000'); p.setAttribute('d', cellPath(CS, RAD[type].map(v => v * CS)));
      g.appendChild(p); svg.appendChild(g);
      cells.push({ c, r, odd, g, p, rot: Math.floor(rnd(i + 99) * 4), dir: rnd(i + 7) < .5 ? 1 : -1 });
    }
    const TICKS = Array.from({ length: 9 }, (_, n) => .05 + .38 * n), ODD_TURNS = 3;
    const A0 = 1.2, G0 = 2.2;
    const oddCell = { x: ODD[0] * CS, y: OY + ODD[1] * CS, w: CS, h: CS };
    const lines = k => [...L.querySelectorAll('[data-pl-h="' + k + '"] [data-pl-line]')];
    const setLines = (k, T, at, out) => lines(k).forEach(l => {
      const kin = seg(T, at, at + .6), kout = seg(T, out, out + .35, io3);
      l.style.transform = 'translateY(' + ((1 - kin) * 110 - kout * 110).toFixed(2) + '%)';
    });
    return { end: 3.5, jump: G0, speed: 1.6, frame: T => {
      const square = seg(T, A0 + .05, A0 + .4), yellow = seg(T, A0 + .15, A0 + .4), away = seg(T, G0, G0 + .8, io3);
      cells.forEach(cl => {
        let turns = 0; const lag = (cl.c + cl.r) * .015;
        TICKS.forEach((tt, n) => { if (!cl.odd || n < ODD_TURNS) turns += seg(T, tt + lag, tt + lag + .32, io3); });
        const ang = (cl.rot + turns * cl.dir) * 90;
        const d = Math.hypot(cl.c - ODD[0], cl.r - ODD[1]);
        const sc = cl.odd ? 1 : 1 - seg(T, G0 + d * .03, G0 + .5 + d * .03, io3);
        cl.g.setAttribute('transform', 'translate(' + (cl.c * CS + CS / 2) + ' ' + (OY + cl.r * CS + CS / 2) + ') rotate(' + (cl.odd && T > A0 ? Math.round(ang / 90) * 90 : ang) + ') scale(' + sc.toFixed(4) + ') translate(' + (-CS / 2) + ' ' + (-CS / 2) + ')');
        if (cl.odd) {
          cl.p.setAttribute('d', cellPath(CS, RAD.quarter.map(v => v * CS * (1 - square))));
          cl.p.setAttribute('fill', 'rgb(' + Math.round(255 * yellow) + ',' + Math.round(178 * yellow) + ',0)');
          cl.g.style.opacity = T > G0 ? '0' : '1';
        }
      });
      if (T > G0) {
        const k = seg(T, G0, G0 + .8);
        rect.style.opacity = '1';
        Object.assign(rect.style, { left: GW.lerp(oddCell.x, field.x, k) + 'px', top: GW.lerp(oddCell.y, field.y, k) + 'px', width: GW.lerp(oddCell.w, field.w, k) + 'px', height: GW.lerp(oddCell.h, field.h, k) + 'px' });
      }
      write(T, G0 + .7, G0 + 1.25);
      const g = Math.round(68 * (1 - away)), gb = Math.round(66 * (1 - away));
      L.style.background = 'rgb(' + g + ',' + g + ',' + gb + ')';
      setLines('a', T, .2, A0 + .2);
      setLines('b', T, A0 + .3, G0 + .2);
    } };
  }

  /* Licht: Linie, Fensterband, Fenster */
  v_licht({ L, rect, field: f, io3, seg, write, box, vw }) {
    L.style.background = '#000000';
    const cy = f.y + f.h / 2, line = document.createElement('div');
    const slow = t => t < .5 ? 16 * t ** 5 : 1 - Math.pow(-2 * t + 2, 5) / 2;
    Object.assign(line.style, { position: 'absolute', left: '0', top: cy - .5 + 'px', width: vw + 'px', height: '1px', background: '#FFFFFF', transformOrigin: '0 50%', transform: 'scaleX(0)' });
    L.insertBefore(line, rect);
    Object.assign(rect.style, { opacity: '0' });
    return { end: 5.55, jump: 3.3, speed: 2.4, frame: T => {
      line.style.transform = 'scaleX(' + seg(T, .7, 2.3, io3).toFixed(4) + ')';
      const warm = seg(T, 2.0, 2.4, t => t);
      line.style.background = 'rgb(255,' + Math.round(255 - 77 * warm) + ',' + Math.round(255 * (1 - warm)) + ')';
      line.style.opacity = T > 2.45 ? '0' : '1';
      const open = seg(T, 2.4, 3.6, slow), close = seg(T, 3.5, 5.0, slow);
      rect.style.opacity = T > 2.4 ? '1' : '0';
      const hh = 1 + (f.h - 1) * open;
      box(rect, { x: GW.lerp(0, f.x, close), y: cy - hh / 2, w: GW.lerp(vw, f.w, close), h: hh });
      write(T, 4.6, 5.45);
    } };
  }

  /* Grundriss: Plan zeichnet sich, Türschwenk wird zum Feld */
  v_grundriss({ L, rect, field: f, io3, seg, write, box, vw, vh }) {
    L.style.background = '#000000';
    const NS = 'http://www.w3.org/2000/svg', w = f.w, h = f.h;
    const Lx = f.x - 1.15 * w, R = f.x + w, T0 = f.y - .55 * h, B = f.y + h, r = w * .32, x0 = f.x + w * .12;
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('width', vw); svg.setAttribute('height', vh); svg.style.cssText = 'position:absolute;inset:0;overflow:visible';
    L.querySelector('[data-pl-grid]').appendChild(svg);
    const ds = [
      'M' + x0 + ' ' + B + 'H' + Lx + 'V' + T0 + 'H' + R + 'V' + B + 'H' + (x0 + r),
      'M' + f.x + ' ' + B + 'V' + f.y + 'H' + R,
      'M' + Lx + ' ' + (f.y + h * .35) + 'H' + (f.x - w * .42),
      'M' + (f.x - w * .6) + ' ' + T0 + 'V' + (T0 + h * .4),
      'M' + x0 + ' ' + B + 'V' + (B - r),
      'M' + (x0 + r) + ' ' + B + 'A' + r + ' ' + r + ' 0 0 0 ' + x0 + ' ' + (B - r)
    ];
    const paths = ds.map(d => {
      const p = document.createElementNS(NS, 'path');
      p.setAttribute('d', d); p.setAttribute('fill', 'none'); p.setAttribute('stroke', '#CACACA'); p.setAttribute('stroke-width', '1');
      p.setAttribute('pathLength', '1'); p.setAttribute('stroke-dasharray', '1'); p.setAttribute('stroke-dashoffset', '1');
      svg.appendChild(p); return p;
    });
    const door = { x: x0, y: B - r, w: r, h: r };
    box(rect, door);
    Object.assign(rect.style, { opacity: '1', transformOrigin: '0 100%', transform: 'scale(0)', borderTopRightRadius: r + 'px' });
    return { end: 3.3, jump: 1.9, speed: 2, frame: T => {
      paths.forEach((p, i) => p.setAttribute('stroke-dashoffset', (1 - seg(T, .1 + i * .16, .75 + i * .16, io3)).toFixed(4)));
      rect.style.transform = 'scale(' + seg(T, 1.35, 1.85, io3).toFixed(4) + ')';
      const k = seg(T, 1.95, 2.7);
      box(rect, { x: GW.lerp(door.x, f.x, k), y: GW.lerp(door.y, f.y, k), w: GW.lerp(door.w, f.w, k), h: GW.lerp(door.h, f.h, k) });
      rect.style.borderTopRightRadius = (r * (1 - seg(T, 1.95, 2.5, io3))).toFixed(2) + 'px';
      svg.style.opacity = (1 - seg(T, 2.15, 2.75)).toFixed(3);
      write(T, 2.6, 3.15);
    } };
  }

  /* Fertigung: Elemente werden gesetzt, die Fugen schließen sich */
  v_fertigung({ L, rect, field: f, io3, seg, write, box, vh }) {
    const N = 4, gap = 2, sw = f.w / N, outl = [], strips = [];
    for (let i = 0; i < N; i++) {
      const o = document.createElement('div'), s = document.createElement('div');
      Object.assign(o.style, { position: 'absolute', outline: '1px solid #CACACA', outlineOffset: '-1px', opacity: '0' });
      box(o, { x: f.x + i * sw, y: f.y, w: sw, h: f.h });
      Object.assign(s.style, { position: 'absolute', background: 'var(--griffner-gelb)', willChange: 'transform' });
      L.insertBefore(o, rect); L.insertBefore(s, rect);
      outl.push(o); strips.push(s);
    }
    const word = document.createElement('div');
    Object.assign(word.style, { position: 'absolute', left: f.x + 'px', top: f.y + f.h + f.w * .078 + 'px', fontFamily: 'var(--font-text)', fontWeight: '500', fontSize: 'var(--fs-info-web, 12px)', letterSpacing: 'var(--tracking-info-web, .08em)', textTransform: 'uppercase', color: 'var(--griffner-weiss)', opacity: '0', whiteSpace: 'nowrap' });
    L.insertBefore(word, rect);
    box(rect, f);
    const WORDS = ['Design.', 'Engineer.', 'Make.', 'Build.'], WT = [.15, .8, 1.4, 2.0];
    let wi = -1;
    return { end: 3.5, jump: 2.0, speed: 2, frame: T => {
      const oo = seg(T, .1, .6) * .5 * (1 - seg(T, 2.2, 2.5));
      const g = gap * (1 - seg(T, 2.35, 2.7, io3));
      strips.forEach((s, i) => {
        outl[i].style.opacity = oo.toFixed(3);
        const k = seg(T, .75 + i * .3, 1.5 + i * .3);
        box(s, { x: f.x + i * sw + g / 2, y: f.y, w: sw - g, h: f.h });
        s.style.transform = 'translate3d(0,' + ((1 - k) * (vh - f.y + 40)).toFixed(1) + 'px,0)';
        s.style.opacity = T > 2.72 ? '0' : '1';
      });
      rect.style.opacity = T > 2.7 ? '1' : '0';
      let n = 0; WT.forEach((t, i) => { if (T >= t) n = i; });
      if (n !== wi) { wi = n; word.textContent = WORDS[n]; }
      word.style.opacity = (seg(T, WT[n], WT[n] + .2) * (1 - seg(T, 2.55, 2.8))).toFixed(3);
      const a = seg(T, 2.3, 2.9, io3), c = Math.round(68 * (1 - a)), cb = Math.round(66 * (1 - a));
      L.style.background = 'rgb(' + c + ',' + c + ',' + cb + ')';
      write(T, 2.85, 3.4);
    } };
  }

  /* Skizze: Hand zeichnet das Feld, der Plan wird gerade, das Feld wird gebaut */
  v_skizze({ L, rect, field: f, io3, seg, write, box }) {
    L.style.background = '#000000';
    const NS = 'http://www.w3.org/2000/svg', w = f.w, x0 = f.x, y0 = f.y, x1 = f.x + f.w, y1 = f.y + f.h;
    const rnd = i => { const x = Math.sin(i * 91.7 + 47.3) * 43758.5453; return x - Math.floor(x); };
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('width', innerWidth); svg.setAttribute('height', innerHeight); svg.style.cssText = 'position:absolute;inset:0;overflow:visible';
    L.querySelector('[data-pl-grid]').appendChild(svg);
    const E = [[x0, y0, x1, y0], [x1, y0, x1, y1], [x1, y1, x0, y1], [x0, y1, x0, y0], [x0, y0, x1, y0], [x1, y0, x1, y1]];
    const DRAW = [[.35, 1.0], [.9, 1.5], [1.4, 2.05], [1.95, 2.55], [2.05, 2.45], [2.2, 2.6]];
    const S = E.map((e, i) => {
