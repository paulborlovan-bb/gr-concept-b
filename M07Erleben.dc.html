<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/griffner-design-system-559bd893-028e-430e-8bdc-39370a39b0ca/styles.css">
<link rel="stylesheet" href="site/griffner-web.css">
<script src="site/content.js"></script>
<script src="site/griffner-web.js"></script>
<script src="_ds/griffner-design-system-559bd893-028e-430e-8bdc-39370a39b0ca/_ds_bundle.js"></script>
</helmet>
<section id="erleben" data-room="erleben" data-screen-label="07 Erleben" class="gri-hell" style="position:relative;background:transparent;color:var(--griffner-schwarz);padding:var(--section-pad) var(--page-margin)">
  <div style="display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap-col);row-gap:clamp(28px,4vh,44px)">
    <h2 data-reveal="0" style="grid-column:1 / span 7;grid-row:1;max-width:6.6em;text-wrap:balance;margin:0;font-family:var(--font-display);font-weight:300;font-size:var(--fs-statement-web);line-height:var(--leading-statement-web);text-transform:uppercase;font-feature-settings:'liga' 0">{{ statement }}</h2>
    <div data-amb="1" aria-hidden="true" style="grid-column:8 / span 4;grid-row:1;pointer-events:none"></div>
    <p data-reveal="140" style="grid-column:8 / span 5;grid-row:2;margin:0;font-size:var(--fs-text-web);line-height:var(--leading-body);min-width:min(100%,280px)">{{ text }}</p>
  </div>

  <div data-amb="1" aria-hidden="true" style="position:absolute;left:var(--page-margin);bottom:calc(var(--section-pad) + 8%);width:18%;height:clamp(160px,16vw,260px);pointer-events:none"></div>
  <div style="margin-top:clamp(96px,16vh,200px);margin-left:auto;max-width:min(100%,74%);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:clamp(48px,6vh,72px) clamp(24px,3vw,48px)">
    <sc-for list="{{ entries }}" as="e" hint-placeholder-count="3">
      <article data-reveal="{{ e.delay }}" style="display:grid;gap:20px;align-content:start">
        <a data-lux="1" href="{{ e.href }}" aria-label="{{ e.title }}" style="position:relative;display:block;aspect-ratio:4 / 5;overflow:hidden;background:var(--griffner-schwarz)">
          <sc-if value="{{ e.img }}" hint-placeholder-val="{{ false }}">
            <img src="{{ e.img }}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform 2400ms var(--ease)" style-hover="transform:scale(1.03)"></img>
          </sc-if>
          <span style="position:absolute;left:0;bottom:0;background:var(--griffner-schwarz);color:var(--griffner-weiss);padding:8px 10px;font-weight:500;font-size:10px;letter-spacing:var(--tracking-info-web);text-transform:uppercase">{{ e.label }}</span>
        </a>
        <div style="display:grid;gap:10px;border-top:1px solid var(--griffner-kalk);padding-top:18px">
          <h3 style="margin:0;font-family:var(--font-display);font-weight:500;font-size:clamp(20px,1.6vw,26px);line-height:var(--leading-headline-web);letter-spacing:var(--tracking-headline);text-transform:uppercase;font-feature-settings:'liga' 0">{{ e.title }}</h3>
          <p style="margin:0;font-weight:500;font-size:var(--fs-info-web);letter-spacing:var(--tracking-info-web);text-transform:uppercase;font-variant-numeric:tabular-nums">{{ e.info }}</p>
          <div style="margin-top:8px">
            <x-import component-from-global-scope="GRIFFNERDesignSystem_559bd8.Button" variant="line" arrow="{{ true }}" href="{{ e.href }}" hint-size="180px,32px">{{ e.link }}</x-import>
          </div>
        </div>
      </article>
    </sc-for>
  </div>

</section>
<section id="kontakt-sec" data-room="kontakt" data-screen-label="07 Kontakt" style="position:relative;background:transparent;color:var(--griffner-weiss);padding:var(--section-pad) var(--page-margin)">
  <div id="kontakt" style="display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap-col);row-gap:clamp(28px,4vh,44px)">
    <h2 data-reveal="0" style="grid-column:1 / span 8;max-width:13em;margin:0;font-family:var(--font-display);font-weight:500;font-size:var(--fs-headline-web);line-height:var(--leading-headline-web);letter-spacing:var(--tracking-headline);text-transform:uppercase;font-feature-settings:'liga' 0;text-wrap:balance;min-width:min(100%,300px)">{{ head }}</h2>
    <div data-amb="1" aria-hidden="true" style="grid-column:1 / span 4;grid-row:2;align-self:end;aspect-ratio:5 / 4;margin-bottom:clamp(24px,6vh,80px);pointer-events:none"></div>
    <p data-reveal="100" style="grid-column:1 / span 5;grid-row:2;align-self:start;margin:0;font-size:var(--fs-text-web);line-height:var(--leading-body);min-width:min(100%,280px)">{{ headText }}</p>
    <div data-stage="1" data-dock="rect" data-dock-solid="1" data-dock-trigger="kontakt" style="grid-column:6 / -1;margin-right:calc(-1 * var(--page-margin));margin-top:clamp(24px,5vh,64px);padding:clamp(32px,4.4vw,72px);box-sizing:border-box;min-width:min(calc(100% + var(--page-margin)),320px);color:var(--griffner-schwarz)">
      <sc-if value="{{ notSent }}" hint-placeholder-val="{{ true }}">
        <form onSubmit="{{ submit }}" noValidate="{{ true }}" style="--line:#000000;--text-primary:#000000;--surface-page:#FFB200;--text-secondary:#444442;--text-tertiary:#444442;position:relative;z-index:6;display:grid;gap:clamp(28px,4vh,40px);max-width:760px;margin:0">
          <div style="display:grid;gap:14px">
            <span style="font-weight:500;font-size:var(--fs-info-web);letter-spacing:var(--tracking-info-web);text-transform:uppercase">{{ f.topicLabel }}</span>
            <x-import component-from-global-scope="GRIFFNERDesignSystem_559bd8.ChoiceGroup" options="{{ f.topics }}" value="{{ topic }}" on-change="{{ setTopic }}" columns="{{ topicCols }}" hint-size="100%,56px"></x-import>
          </div>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:clamp(24px,3vh,32px) var(--gap-col)">
            <x-import component-from-global-scope="GRIFFNERDesignSystem_559bd8.TextField" label="{{ f.name }}" name="name" value="{{ name }}" on-change="{{ setName }}" error="{{ errName }}" hint-size="100%,64px"></x-import>
            <x-import component-from-global-scope="GRIFFNERDesignSystem_559bd8.TextField" label="{{ f.contact }}" name="contact" value="{{ contact }}" on-change="{{ setContact }}" error="{{ errContact }}" hint-size="100%,64px"></x-import>
          </div>
          <div style="--fs-body:15px">
            <x-import component-from-global-scope="GRIFFNERDesignSystem_559bd8.TextField" label="{{ f.message }}" name="message" multiline="{{ true }}" rows="{{ 3 }}" placeholder="{{ f.messageHint }}" value="{{ message }}" on-change="{{ setMessage }}" hint-size="100%,110px"></x-import>
          </div>
          <div style="--fs-body:14px;display:grid;gap:8px">
            <x-import component-from-global-scope="GRIFFNERDesignSystem_559bd8.Checkbox" label="{{ f.newsletter }}" checked="{{ newsletter }}" on-change="{{ setNewsletter }}" hint-size="100%,40px"></x-import>
            <sc-if value="{{ errNewsletter }}" hint-placeholder-val="{{ false }}"><span style="padding-left:32px;font-size:14px;line-height:1.45;font-weight:600">{{ errNewsletter }}</span></sc-if>
          </div>
          <div style="--fs-body:14px;display:grid;gap:8px">
            <x-import component-from-global-scope="GRIFFNERDesignSystem_559bd8.Checkbox" label="{{ f.consent }}" checked="{{ consent }}" on-change="{{ setConsent }}" hint-size="100%,40px"></x-import>
            <div style="display:flex;flex-wrap:wrap;gap:6px 20px;padding-left:32px;font-size:14px;line-height:1.45">
              <a href="{{ f.privacyHref }}" style="color:inherit;text-decoration:underline;text-underline-offset:3px">{{ f.privacy }}</a>
              <sc-if value="{{ errConsent }}" hint-placeholder-val="{{ false }}"><span style="font-weight:600">{{ errConsent }}</span></sc-if>
            </div>
          </div>
          <div style="display:flex;flex-wrap:wrap;align-items:center;gap:20px clamp(24px,3vw,48px);padding-top:4px">
            <x-import component-from-global-scope="GRIFFNERDesignSystem_559bd8.Button" variant="primary" size="lg" arrow="{{ true }}" type="submit" hint-size="240px,58px">{{ f.submit }}</x-import>
          </div>
        </form>
      </sc-if>
      <sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}">
        <div style="position:relative;z-index:6;display:grid;gap:clamp(20px,3vh,28px);max-width:560px;min-height:clamp(240px,34vh,380px);align-content:end">
          <h3 style="margin:0;font-family:var(--font-display);font-weight:500;font-size:var(--fs-headline-web);line-height:var(--leading-headline-web);letter-spacing:var(--tracking-headline);text-transform:uppercase;font-feature-settings:'liga' 0">{{ thanksHead }}</h3>
          <p style="margin:0;font-size:var(--fs-text-web);line-height:var(--leading-body);text-wrap:pretty">{{ f.thanksText }}</p>
          <sc-if value="{{ sentNewsletter }}" hint-placeholder-val="{{ false }}"><p style="margin:0;font-size:var(--fs-text-web);line-height:var(--leading-body);font-weight:600;text-wrap:pretty">{{ f.newsletterThanks }}</p></sc-if>
          <div>
            <x-import component-from-global-scope="GRIFFNERDesignSystem_559bd8.Button" variant="line" on-click="{{ reset }}" hint-size="160px,32px">{{ f.again }}</x-import>
          </div>
        </div>
      </sc-if>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { topic: null, name: '', contact: '', message: '', consent: false, newsletter: false, tried: false, sent: false };
  check(s) {
    const F = ((window.GRIFFNER_CONTENT || {}).erleben || {}).form || {};
    const c = s.contact.trim(), okContact = /\S+@\S+\.\S+/.test(c) || c.replace(/[^\d]/g, '').length >= 6;
    return { name: s.name.trim() ? '' : F.errName, contact: okContact ? '' : F.errContact, consent: s.consent ? '' : F.errConsent, newsletter: s.newsletter && !/\S+@\S+\.\S+/.test(c) ? F.errNewsletter : '' };
  }
  componentDidMount() {
    this.kcCheck = () => {
      const el = document.querySelector('[data-kclaim]'); if (!el || el.dataset.on) return;
      if ((window.GW && GW.reduce) || el.getBoundingClientRect().top < innerHeight * .9) { el.dataset.on = '1'; el.style.clipPath = 'inset(0 0% 0 0)'; removeEventListener('scroll', this.kcCheck); }
    };
    addEventListener('scroll', this.kcCheck, { passive: true });
    setTimeout(this.kcCheck, 300);
    const go = () => window.GW && window.GRIFFNER_CONTENT && document.getElementById('erleben') ? GW.ready(() => { GW.reveal(document.getElementById('erleben')); const k = document.getElementById('kontakt-sec'); if (k) GW.reveal(k); }) : setTimeout(go, 40);
    go();
  }
  renderVals() {
    const E = (window.GRIFFNER_CONTENT || {}).erleben || {}, F = E.form || {};
    return {
      statement: E.statement, text: E.text, head: E.head, headText: E.headText,
      primary: E.primary, secondary: E.secondary,
      f: F, ...(() => {
        const s = this.state, err = s.tried ? this.check(s) : {};
        return {
          topic: s.topic || (F.topics || [])[0], name: s.name, contact: s.contact, message: s.message, consent: s.consent,
          errName: err.name || undefined, errContact: err.contact || undefined, errConsent: err.consent || '', errNewsletter: err.newsletter || '', newsletter: s.newsletter, sentNewsletter: s.sent && s.newsletter,
          sent: s.sent, notSent: !s.sent,
          thanksHead: (F.thanksHead || '').replace('{name}', s.name.trim().split(' ')[0] || ''),
          topicCols: window.innerWidth < 1100 ? 1 : 3
        };
      })(),
      setTopic: v => this.setState({ topic: v }),
      setName: v => this.setState({ name: v }),
      setContact: v => this.setState({ contact: v }),
      setMessage: v => this.setState({ message: v }),
      setConsent: v => this.setState({ consent: v }),
      setNewsletter: v => this.setState({ newsletter: v }),
      submit: e => {
        e.preventDefault();
        const err = this.check(this.state);
        if (err.name || err.contact || err.consent || err.newsletter) { this.setState({ tried: true }); return; }
        this.setState({ sent: true });
      },
      reset: () => this.setState({ topic: null, name: '', contact: '', message: '', consent: false, newsletter: false, tried: false, sent: false }),
      entries: (E.entries || []).map((e, i) => ({ ...e, delay: i * 140 })),
      kcCol: window.innerWidth < 900 ? '1 / -1' : '1 / span 4', kcRow: window.innerWidth < 900 ? '4' : '2',
      claimW: Math.round(Math.min(320, Math.max(180, window.innerWidth * .2)))
    };
  }
}
</script>
</body>
</html>
