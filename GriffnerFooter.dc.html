    if (!p.getAttribute('d')) {
      if (!this.fkLoad) this.fkLoad = fetch('assets/logo/griffner-claim-maske.svg').then(r => r.text()).then(t => { const m = t.match(/\sd="([^"]+)"/); if (m) { p.setAttribute('d', m[1]); this.scroll(); } }).catch(() => {});

  tick() {

    if (wm) {

      const showWm = () => { wm.style.clipPath = 'inset(0% 0 0 0)'; wm.firstElementChild.style.transform = 'translateY(0%)'; };
      if (!wm.dataset.on && wm.getBoundingClientRect().top < vh * .85) {
        wm.dataset.on = '1';
        if (!cin || (window.GW && GW.reduce)) { if (cin) cin.style.opacity = '0'; showWm(); }
        else {
          cin.style.clipPath = 'inset(0 0% 0 0)';
          this.t1 = setTimeout(() => { cin.style.opacity = '0'; }, 2700);
          this.t2 = setTimeout(showWm, 3100);
        }
      }
    }
    const img = f.querySelector('[data-fimg]');
    if (img) {
      const r = img.parentElement.getBoundingClientRect(), k = cl((vh - r.top) / (vh + r.height * .6));
      img.style.transform = 'scale(' + (1.14 - .14 * ease(k)).toFixed(4) + ')';
      const c = f.querySelector('[data-fconn]');
      if (c) c.style.transform = 'translateY(' + (-50 + (1 - ease(k)) * 60).toFixed(2) + '%)';
    }
    const sig = f.querySelector('[data-fsig-t]');
    if (sig) {
      const r = sig.closest('[data-fsig]').getBoundingClientRect(), k = ease(cl((vh - r.top) / (r.height + vh * .3)));
      sig.setAttribute('textLength', (560 + 440 * k).toFixed(1));
      sig.setAttribute('x', ((1 - k) * 220).toFixed(1));
    }
  }
  renderVals() {
    const F = (window.GRIFFNER_CONTENT || {}).footer || {};
    const v = this.props.variant ?? 'signal', cols = F.cols || [];
    const vw = this.state.w, m = Math.max(24, Math.min(vw / 12, 120));
    return {
      fkGelb: (this.props.finaleFarbe ?? 'gelb') === 'gelb', fkWeiss: (this.props.finaleFarbe ?? 'gelb') !== 'gelb',
      isSignal: v === 'signal', isStanze: (this.props.finale ?? 'stanze') === 'stanze', isAbend: v === 'abend', isOrt: v === 'ort', isAlt: v === 'aktuell',
      cols: 5, rows: 1, cell: Math.floor(vw / 5),
      wmW: this.state.wm || Math.round(vw - 2 * m),
      columns: cols, address: F.address || [], legal: F.legal || [],
      coords: '46.70 N / 14.73 E',
      addrLine: (F.address || []).join(' / '),
      sigMain: ((window.GRIFFNER_CONTENT || {}).menu || { items: [] }).items.map(it => ({ label: it.label, href: it.href })),
      sigService: (((window.GRIFFNER_CONTENT || {}).menu || {}).links || []).map(([label, href]) => ({ label, href })),
      sgA: vw < 760 ? '1 / span 6' : '7 / span 2', sgB: vw < 760 ? '7 / span 6' : '9 / span 2', sgC: vw < 760 ? '1 / -1' : '11 / span 2',
      main: (cols[1] || {}).links || [],
      service: [...((cols[0] || {}).links || []), ...((cols[2] || {}).links || [])],
      time: this.state.time,
      claimW: Math.round(Math.min(720, Math.max(220, (this.state.wm || vw) * .42)))
    };
  }
