<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { menuOpen: false, w: innerWidth };
  componentDidMount() {
    this.onMenu = e => this.setState({ menuOpen: e.detail.open }, () => this.paint());
    this.onRes = () => this.setState({ w: innerWidth });
    addEventListener('griffner:menu-state', this.onMenu);
    addEventListener('resize', this.onRes);
    this.onDate = () => this.forceUpdate(); addEventListener('griffner:date', this.onDate);
    this.lastY = scrollY;
    this.onScroll = () => this.band();
    addEventListener('scroll', this.onScroll, { passive: true });
    this.band();
    this.onIntro = () => this.paint();
    this.onReplay = () => { document.querySelectorAll('[data-logo],[data-hside]').forEach(e => e.style.opacity = '0'); };
    addEventListener('griffner:intro', this.onIntro);
    addEventListener('griffner:replay', this.onReplay);
    const go = () => window.GW ? (GW.introDone && this.paint()) : setTimeout(go, 40);
    go();
  }
  componentWillUnmount() { removeEventListener('griffner:menu-state', this.onMenu); removeEventListener('resize', this.onRes); removeEventListener('griffner:date', this.onDate); removeEventListener('scroll', this.onScroll); removeEventListener('griffner:intro', this.onIntro); removeEventListener('griffner:replay', this.onReplay); }
  band() {
    const hd = document.querySelector('[data-header]'), logo = document.querySelector('[data-logo]'), f = document.querySelector('[data-dock="home"]');
    if (!hd || !logo || !f) return;
    const y = scrollY, dy = y - this.lastY, open = this.state.menuOpen;
    const compact = y > 80 && !open;
    if (Math.abs(dy) > 6 || y < 80 || open) {
      this.hidden = compact && dy > 0 && y > innerHeight * .5;
      this.lastY = y;
    }
    hd.style.paddingTop = compact ? '6px' : '20px';
    f.style.height = compact ? '0px' : '72px';
    logo.style.gap = compact ? '0px' : '7px';
    hd.style.transform = this.hidden && !open ? 'translateY(-110%)' : 'none';
  }
  paint() {
    this.band();
    const logo = document.querySelector('[data-logo]');
    const on = GW.introDone ? '1' : '0';
    if (logo) logo.style.opacity = on;
    document.querySelectorAll('[data-hside]').forEach(e => e.style.opacity = on);
    const f = document.querySelector('[data-dock="home"]');
    if (f) f.style.background = this.state.menuOpen ? 'var(--griffner-gelb)' : 'transparent';
  }
  renderVals() {
    const C = (window.GRIFFNER_CONTENT || {}).header || {};
    const narrow = this.state.w < 600;
    const S = (window.GRIFFNER_CONTENT || {}).season, G = window.GW;
    let chapter = '';
    if (S && G && G.today() <= S.hideAfter && !this.state.menuOpen) {
      const op = S.chapters.filter(c => G.isOpen(c.iso)); chapter = (op[op.length - 1] || S.chapters[0]).nr + '/05';
    }
    const op = this.state.menuOpen, hv = this.state.hov;
    return {
      chapter,
      l1w: op ? '22px' : '28px', l2w: op ? '22px' : (hv ? '28px' : '16px'),
      l1t: op ? 'translate(3px,3.5px) rotate(45deg)' : 'none',
      l2t: op ? 'translate(3px,-3.5px) rotate(-45deg)' : 'none',
      hovOn: () => this.setState({ hov: true }), hovOff: () => this.setState({ hov: false }),
      menuOpen: this.state.menuOpen ? 'true' : 'false',
      menuLabel: this.state.menuOpen ? C.close : C.menu,
      cta: C.cta, ctaHref: C.ctaHref || '#kontakt',
      ctaSize: narrow ? '10px' : 'var(--fs-info-web)',
      ctaTrack: narrow ? '.12em' : 'var(--tracking-info-web)',
      toggle: () => dispatchEvent(new CustomEvent('griffner:menu-toggle'))
    };
  }
}
</script>
