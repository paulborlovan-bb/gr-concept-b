<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount() {
    const go = () => window.GW && window.gsap && window.GRIFFNER_CONTENT ? this.setup() : setTimeout(go, 30);
    go();
  }
  componentWillUnmount() { cancelAnimationFrame(this.raf); removeEventListener('griffner:replay', this.rp); removeEventListener('mousemove', this.mm); removeEventListener('deviceorientation', this.mo); removeEventListener('resize', this.rs); this.ro && this.ro.disconnect(); }
  q(s) { return this.root.querySelector(s); }
  setup() {
    this.root = document.getElementById('top');
    if (!this.root) return setTimeout(() => this.setup(), 30);
    const f = GW.fieldStart(), win = this.q('[data-win]'), mk = this.q('[data-hmark]');
    Object.assign(win.style, { left: f.x + 'px', top: f.y + 'px', width: f.w + 'px', height: f.h + 'px' });
    Object.assign(mk.style, { left: f.x + 'px', top: f.y + f.h + f.w * .078 + 'px', opacity: '1' });
    this.m = { x: 0, y: 0, sx: 0, sy: 0 };
    this.mm = e => { this.m.x = e.clientX / innerWidth * 2 - 1; this.m.y = e.clientY / innerHeight * 2 - 1; };
    this.mo = e => { if (e.gamma == null) return; this.m.x = GW.clamp(e.gamma / 25, -1, 1); this.m.y = GW.clamp((e.beta - 45) / 25, -1, 1); };
    addEventListener('mousemove', this.mm); addEventListener('deviceorientation', this.mo);
    const pic = this.q('[data-pic]');
    const loop = () => {
      const m = this.m; m.sx += (m.x - m.sx) * .05; m.sy += (m.y - m.sy) * .05;
      if (!GW.reduce) pic.style.transform = `translate3d(${(m.sx * -1.6).toFixed(2)}%,${(m.sy * -1.1).toFixed(2)}%,0)`;
      this.raf = requestAnimationFrame(loop);
    };
    loop();
    this.fit();
    if (document.fonts) {
      const fam = getComputedStyle(this.q('[data-st]')).fontFamily;
      document.fonts.load('300 100px ' + fam, 'HAUSBAU').then(() => this.fit(), () => {});
      document.fonts.ready.then(() => this.fit());
    }
    this.rs = () => this.fit(); addEventListener('resize', this.rs);
    if (window.ResizeObserver) { this.ro = new ResizeObserver(() => this.fit()); this.ro.observe(this.q('[data-st]')); }
    this.rp = () => this.reset(); addEventListener('griffner:replay', this.rp);
    GW.onLoader(() => this.open());
  }
  reset() {
    this.tl && this.tl.kill();
    if (this.stw) { this.stw.scrollTrigger && this.stw.scrollTrigger.kill(); this.stw.kill(); this.stw = null; }
    this.scrubbed = 0;
    const f = GW.fieldStart();
    gsap.set(this.q('[data-win]'), { left: f.x, top: f.y, width: f.w, height: f.h });
    gsap.set(this.q('[data-hmark]'), { x: 0, y: 0, scale: 1, opacity: 1 });
    gsap.set(this.q('[data-view]'), { opacity: 0, scale: 1 });
    gsap.set(this.q('[data-night]'), { opacity: .75 });
    gsap.set(this.q('[data-dawn]'), { opacity: 0 });
    gsap.set(this.q('[data-pic]'), { filter: 'brightness(.55) saturate(.6)' });
    gsap.set(this.q('[data-prot]'), { opacity: 0 });
    gsap.set(this.q('[data-st]'), { opacity: 0 });
    gsap.set(this.root.querySelectorAll('[data-ln]'), { opacity: 0 });
    const lg = document.querySelector('[data-logo]');
    if (lg) { lg.style.opacity = '0'; GW.onIntro(() => { lg.style.opacity = '1'; }); }
    GW.onLoader(() => this.open());
  }
  fit() {
    const h = this.q('[data-st]'), ls = [...h.querySelectorAll('[data-ln]')];
    if (!ls.length) return;
    const st = this.q('[data-hstage]'), W = st.clientWidth, H = st.offsetHeight, m = h.offsetLeft;
    if (!W) return;
    ls.forEach(l => l.style.fontSize = '100px');
    const ws = ls.map(l => l.getBoundingClientRect().width), wMax = Math.max(...ws), wLast = ws[ws.length - 1];
    if (!wMax || !wLast) return;
    let s = W >= 700 ? Math.min(100 * (W * .55 - m) / wLast, 100 * (W - 2 * m) / wMax) : 100 * (W - 2 * m) * .92 / wMax;
    s = Math.min(s, H * .6 / (ls.length * .84));
    ls.forEach(l => l.style.fontSize = Math.floor(s * 100) / 100 + 'px');
  }
  open() {
    const win = this.q('[data-win]'), mk = this.q('[data-hmark]');
    const big = GW.ms('--dur-big') / 1000, small = GW.ms('--dur-small') / 1000;
    const end = () => { Object.assign(win.style, { left: '50%', top: '0', width: '50%', height: '100%' }); this.scrub(); };
    const target = document.querySelector('[data-wm]');
    if (!target && (this.tries = (this.tries || 0) + 1) < 60) return setTimeout(() => this.open(), 30);
    this.tries = 0;
    GW.onIntro(() => gsap.to(mk, { opacity: 0, duration: .25, overwrite: 'auto' }));
    if (GW.reduce) {
      end(); mk.style.opacity = '0';
      ['[data-view]', '[data-prot]', '[data-st]'].forEach(s => this.q(s).style.opacity = '1');
      this.q('[data-night]').style.opacity = '0'; this.q('[data-pic]').style.filter = 'none';
      GW.finishIntro(); return;
    }
    if ((this.props.intro ?? 'fenster') === 'fenster') return this.openFenster(win, mk, target, big, small, end);
    const tl = this.tl = gsap.timeline({ delay: .25, defaults: { ease: GW.ease } });
    tl.to(win, { left: innerWidth / 2, top: 0, width: innerWidth / 2, height: this.q('[data-hstage]').offsetHeight, duration: big * 1.1, onComplete: end }, 0)
      .to(this.q('[data-view]'), { opacity: 1, duration: small }, .1)
      .to(this.q('[data-night]'), { opacity: 0, duration: big * 1.15 }, .3)
      .to(this.q('[data-dawn]'), { opacity: .55, duration: big * 1.15 }, .3)
      .to(this.q('[data-pic]'), { filter: 'brightness(1) saturate(1)', duration: big * 1.15 }, .3)
      .to(this.q('[data-prot]'), { opacity: 1, duration: small }, big * .9);
    if (target) {
      const t = target.getBoundingClientRect(), r = mk.getBoundingClientRect();
      tl.to(mk, { x: t.left - r.left, y: t.top - r.top, scale: t.width / r.width, duration: big }, 0)
        .call(() => GW.finishIntro(), null, big * .95)
        .to(mk, { opacity: 0, duration: .2 }, big * .98);
    } else tl.call(() => GW.finishIntro(), null, big);
    tl.set(this.q('[data-st]'), { opacity: 1 }, big * 1.05)
      .fromTo(this.root.querySelectorAll('[data-ln]'), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: big, stagger: .14 }, big * 1.05);
  }
  openFenster(win, mk, target, big, small, end) {
    const vw = innerWidth, H = this.q('[data-hstage]').offsetHeight, view = this.q('[data-view]');
    const G = 2.6, Lt = 2.2, LD = 1.4, ST = .32, S = Lt + LD + ST * 2 + 1.6, SPLIT = 2.1;
    const lns = this.root.querySelectorAll('[data-ln]');
    gsap.set(view, { scale: 1.28 });
    const tl = this.tl = gsap.timeline({ delay: 0, defaults: { ease: GW.ease } });
    tl.to(win, { left: 0, top: 0, width: vw, height: H, duration: G, ease: 'power2.inOut' }, 0)
      .to(view, { opacity: 1, duration: 1.6, ease: 'power1.inOut' }, .7)
      .to(view, { scale: 1, duration: S + SPLIT, ease: 'power2.out' }, .4)
      .to(this.q('[data-night]'), { opacity: 0, duration: 3.2, ease: 'power1.inOut' }, .9)
      .to(this.q('[data-dawn]'), { opacity: .55, duration: 3.2, ease: 'power1.inOut' }, .9)
      .to(this.q('[data-pic]'), { filter: 'brightness(1) saturate(1)', duration: 3.2, ease: 'power1.inOut' }, .9)
      .to(this.q('[data-prot]'), { opacity: 1, duration: 1.2 }, G * .75);
    if (target) {
      const t = target.getBoundingClientRect(), r = mk.getBoundingClientRect();
      tl.to(mk, { x: t.left - r.left, y: t.top - r.top, scale: t.width / r.width, duration: 2.2, ease: 'power2.inOut' }, 0)
        .call(() => GW.finishIntro(), null, 2.2)
        .to(mk, { opacity: 0, duration: .25 }, 2.25);
    } else tl.call(() => GW.finishIntro(), null, G);
    tl.set(this.q('[data-st]'), { opacity: 1 }, Lt)
      .fromTo(lns, { opacity: 1, yPercent: 60, clipPath: 'inset(0% 0% 100% 0%)' }, { yPercent: 0, clipPath: 'inset(0% 0% 0% 0%)', duration: LD, stagger: ST, ease: 'power3.out' }, Lt)
      .to(win, { left: vw / 2, width: vw / 2, duration: SPLIT, ease: 'power3.inOut', onComplete: end }, S);
  }
  scrub() {
    if (this.scrubbed || GW.reduce || !window.ScrollTrigger) return;
    this.scrubbed = 1;
    gsap.registerPlugin(ScrollTrigger);
    this.stw = gsap.fromTo(this.q('[data-win]'), { left: '50%', width: '50%' }, { left: '0%', width: '100%', ease: 'none',
      scrollTrigger: { trigger: this.root, start: 'top top', end: 'bottom bottom', scrub: .6 } });
  }
  renderVals() {
    const H = (window.GRIFFNER_CONTENT || {}).hero || {};
    const w = String(H.statement || '').split(' ');
    return { img: (this.props.intro ?? 'fenster') === 'fenster' ? 'assets/photos/haus-wald.jpg' : H.img, imgLabel: H.imgLabel, statement: H.statement, lines: w, markW: Math.round(window.GW ? window.GW.fieldStart().w : 200) };
  }
}
</script>
