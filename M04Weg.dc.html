    setL(D.v[0], vA, vB, dop); setL(D.v[1], [vA[0] - tk, vA[1] + tk], [vA[0] + tk, vA[1] - tk], dop); setL(D.v[2], [vB[0] - tk, vB[1] + tk], [vB[0] + tk, vB[1] - tk], dop);
    D.vt.setAttribute('x', F((vA[0] + vB[0]) / 2 + 14)); D.vt.setAttribute('y', F((vA[1] + vB[1]) / 2 + 4)); D.vt.style.opacity = dop.toFixed(3);
    setL(this.proc.scan, [scanX, fy0 - 14], [scanX, fy0 + PH * sf + 14], scanOp);
  }

  renderVals() {
    const W = (window.GRIFFNER_CONTENT || {}).weg || {};
    return {
      statement: W.statement, text: W.text,
      steps: [
        { title: 'Design.', text: 'Du erzählst uns, wie du leben möchtest. Unser Architekturteam macht daraus dein Haus.' },
        { title: 'Engineer.', text: 'Wir denken jedes Detail durch und stimmen Architektur, Konstruktion und Technik aufeinander ab. Die Komplexität bleibt bei uns.' },
        { title: 'Make.', text: 'Wir fertigen dein Haus im eigenen Werk in Griffen. Präzise geplant, sorgfältig gefertigt und bereit für die Montage.' },
        { title: 'Build.', text: 'Unsere eigenen Teams bringen dein Haus auf dein Grundstück. Wir koordinieren die Umsetzung, du musst es nicht.' }
      ].map(s => ({ ...s, chars: [...s.title] }))
    };
  }
}
